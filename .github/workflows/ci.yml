name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - name: Validate generated OpenAPI
        run: |
          cargo run --locked --quiet --bin export-openapi -- /tmp/tardy-openapi.json
          jq -e '.openapi == "3.1.0" and .paths["/v1/search"].post' /tmp/tardy-openapi.json >/dev/null

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tardy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
