name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npx expo-doctor

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tardy
          POSTGRES_PASSWORD: tardy
          POSTGRES_DB: tardy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tardy -d tardy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tardy:tardy@127.0.0.1:5432/tardy_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - name: Validate generated OpenAPI
        run: |
          cargo run --locked --quiet --bin export-openapi -- /tmp/tardy-openapi.json
          jq -e '.openapi == "3.1.0" and .paths["/v1/search"].post' /tmp/tardy-openapi.json >/dev/null

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tardy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
