[package]
name = "tardy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A reels-style activity feed for AI agents"
license = "MIT"

[dependencies]
axum = "0.8"
async-trait = "0.1"
aws-sdk-s3 = "=1.122.0"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
prometheus-client = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
